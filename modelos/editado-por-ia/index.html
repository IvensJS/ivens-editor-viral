*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000;color:#fff;-webkit-font-smoothing:antialiased}
#main{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:"Poppins",Arial,sans-serif}
#shake{position:absolute;inset:0;will-change:transform}
#vwrap{position:absolute;inset:0;transform-origin:400px 1000px;will-change:transform,filter}
#clip{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover}
#vin{position:absolute;inset:0;opacity:0;pointer-events:none;
  background:radial-gradient(ellipse 75% 62% at 50% 50%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 80%,rgba(0,0,0,.85) 100%)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#ui{position:absolute;inset:0}

/* texto padrão: branco com contorno preto */
.tx{font-weight:900;-webkit-text-stroke:6px #000;paint-order:stroke fill;letter-spacing:-1px;line-height:1;
  text-shadow:0 0 4px rgba(0,0,0,.9),0 4px 12px rgba(0,0,0,.75)}
.y{color:#ffd60a}.r{color:#ff3b30}.g{color:#22dd22}

/* legenda */
.cap{position:absolute;left:40px;width:1000px;top:1380px;height:90px;display:flex;justify-content:center;align-items:center;
  font-size:76px;text-transform:uppercase;white-space:nowrap;opacity:0;-webkit-text-stroke:5px #000}
.cap span{margin:0 11px}

/* letras flutuantes */
.big{position:absolute;left:0;width:1080px;display:flex;flex-direction:column;align-items:center;opacity:0;text-transform:uppercase}
.big .ln{display:flex;justify-content:center;white-space:nowrap}
.big .w{display:inline-block;margin:0 14px;will-change:transform}
.big .c{display:inline-block;will-change:transform}

/* emojis e imagens */
.emo{position:absolute;width:240px;height:240px;margin:-120px 0 0 -120px;display:flex;align-items:center;justify-content:center;
  font-family:"Emoji",sans-serif;font-size:190px;line-height:1;opacity:0;
  filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
.img{position:absolute;width:300px;height:300px;margin:-150px 0 0 -150px;opacity:0;filter:drop-shadow(0 12px 22px rgba(0,0,0,.6))}
.img img{width:100%;height:100%;object-fit:contain}

/* CTA */
#cta{position:absolute;left:60px;top:1415px;width:960px;height:132px;border-radius:28px;padding:0 18px 0 34px;display:flex;align-items:center;justify-content:space-between;opacity:0;
  background:rgba(10,10,14,.6);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:2px solid rgba(255,255,255,.25);box-shadow:0 14px 34px rgba(0,0,0,.35)}
#cta p{margin:0;font-weight:800;font-size:48px;line-height:1.1;letter-spacing:-.5px;-webkit-text-stroke:3px #000;paint-order:stroke fill}
#cta .btn{height:88px;padding:0 36px;border-radius:44px;background:#0095f6;display:flex;align-items:center;font-weight:800;font-size:46px;white-space:nowrap}
